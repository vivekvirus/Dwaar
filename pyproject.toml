[project]
name = "dwaar-workspace"
version = "0.0.0"
description = "Dwaar monorepo root (virtual; nothing is built from this file)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.uv]
package = false
default-groups = ["dev"]

# Later agents add their own workspace member to this group (one additive line) and a
# matching entry in [tool.uv.sources].
[dependency-groups]
dev = [
  "dwaar-common",
  "dwaar-api",
  "dwaar-worker",
  "dwaar-edge",
  "dwaar-ai-gateway",
  "dwaar-packs",
  "pytest>=8.3",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.13",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "types-PyYAML",
  "types-jsonschema",
]

[tool.uv.workspace]
members = ["packages/dwaar-*", "services/*"]

[tool.uv.sources]
dwaar-common = { workspace = true }
dwaar-api = { workspace = true }
dwaar-worker = { workspace = true }
dwaar-edge = { workspace = true }
dwaar-ai-gateway = { workspace = true }
dwaar-packs = { workspace = true }

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests", "services", "packages", "tools"]
addopts = "-ra --strict-markers --import-mode=importlib -p tests._harness.plugin"
pythonpath = ["."]
markers = [
  "req(*ids): PRD requirement ID(s) this test evidences, e.g. req('GATE-03')",
  "at(id, dataset=None): PRD acceptance test ID this test evidences, e.g. at('AT-04')",
  "milestone(name): milestone M0..M4 (derived from the acceptance matrix when omitted)",
  "simulation: test exercises a labelled simulator, never a real provider or hardware",
  "slow: slow test (excluded by `-m 'not slow'`)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".local", "node_modules", "apps", "docs/prd"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "T20"]
ignore = [
  "E501",    # `ruff format` wraps code; long prose strings and URLs are allowed
  "RUF012",
  "RUF100",  # stale noqa comments are harmless; do not turn them into red builds
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "T20"]
"tests/**" = ["S101", "S103", "S105", "S106", "S311", "S603", "S607", "T20"]
"tools/**" = ["T20", "S103", "S603", "S607", "S101"]
"**/test_*.py" = ["S101", "S105", "S106", "S311", "T20"]
"tests/_harness/**" = ["S103", "S603", "S607", "S101", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["dwaar_common", "dwaar_api", "dwaar_worker", "dwaar_edge", "dwaar_ai_gateway", "dwaar_packs", "tests"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true
warn_unreachable = true
# Source packages, shared tooling and the harness. Later agents add their package globs
# here only if they live outside these patterns.
files = [
  "packages/*/dwaar_*",
  "packages/dwaar-common/tests",
  "services/*/dwaar_*",
  "tools",
  "tests/_harness",
  "tests/harness",
]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true
