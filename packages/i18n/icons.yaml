version: 1
note: 'Semantic id -> icon name. Allow/deny must never rely on colour alone (UX-02):
  every control pairs icon + text, and allow/deny use different shapes (circle with
  tick vs octagon with cross).'
colour_independent:
- guard.decision.allow
- guard.decision.deny
