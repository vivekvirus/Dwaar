[project]
name = "dwaar-common"
version = "0.1.0"
description = "Shared Dwaar library: UUIDv7, integer-paise money, time, event envelopes, Ed25519 signing, envelope crypto, errors, logging, i18n"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "cryptography>=43",
  "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwaar_common"]

# The i18n catalogues are shared with the JS clients (packages/i18n/locales), so the source of truth stays there;
# the wheel carries a copy INSIDE the package (dwaar_common/locales). dwaar_common.i18n.find_locales_dir() looks
# there after $DWAAR_LOCALES_DIR and before searching the source tree.
[tool.hatch.build.targets.wheel.force-include]
"../i18n/locales" = "dwaar_common/locales"
