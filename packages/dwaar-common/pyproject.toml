[project]
name = "dwaar-common"
version = "0.1.0"
description = "Shared Dwaar library: UUIDv7, integer-paise money, time, event envelopes, Ed25519 signing, envelope crypto, errors, logging, i18n"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "cryptography>=43",
  "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwaar_common"]
