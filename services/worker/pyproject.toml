[project]
name = "dwaar-worker"
version = "0.1.0"
description = "Dwaar background workers (transactional outbox relay, schedulers)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dwaar-common",
  "dramatiq[redis]>=1.17",
  "redis>=5.0",
  "sqlalchemy>=2.0.34,<2.1",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[tool.uv.sources]
dwaar-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwaar_worker"]
