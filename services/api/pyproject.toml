[project]
name = "dwaar-api"
version = "0.1.0"
description = "Dwaar cloud API (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dwaar-common",
  "dwaar-packs",
  "dwaar-ai-gateway",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.34,<2.1",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pyotp>=2.10.0",
]

[tool.uv.sources]
dwaar-common = { workspace = true }
dwaar-packs = { workspace = true }
dwaar-ai-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwaar_api"]

# The SQL migrations live beside the package in the source tree (services/api/migrations) so reviewers see them
# as files, but a non-editable (production image) install must carry them too: they are copied INTO the package
# (dwaar_api/migrations) in the wheel. dwaar_api.core.migrate looks there first, then at the source tree.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "dwaar_api/migrations"
