[project]
name = "dwaar-edge"
version = "0.1.0"
description = "Dwaar society edge gateway (SQLite WAL, local policy engine, signed snapshots, outbox sync)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dwaar-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[tool.uv.sources]
dwaar-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwaar_edge"]
