[project]
name = "dwaar-ai-gateway"
version = "0.1.0"
description = "Dwaar AI gateway (provider adapter, redaction, audit, budgets, kill-switch)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dwaar-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The official SDK is OPTIONAL: the Anthropic adapter is disabled unless DWAAR_AI_ANTHROPIC_API_KEY is set AND this extra is installed
# (the provider registry reports "not configured: <missing dependency>" to authorised admins otherwise).
anthropic = ["anthropic>=0.40"]

[tool.uv.sources]
dwaar-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwaar_ai_gateway"]

# NOTE: the versioned prompt files and evaluation sets live in packages/prompts (repository files, AI-SYS-07); DWAAR_PROMPTS_DIR overrides.
