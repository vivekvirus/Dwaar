[project]
name = "dwaar-ai-gateway"
version = "0.1.0"
description = "Dwaar AI gateway (provider adapter, redaction, audit, budgets, kill-switch)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dwaar-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[tool.uv.sources]
dwaar-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwaar_ai_gateway"]
