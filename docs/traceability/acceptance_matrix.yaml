  milestone: M1
  scenario: A Maharashtra pack has the general-body interest set to 18 percent
  expected: Bill-run preview fails against the 12 percent simple cap and cannot be approved
  prd_page: 47
- id: AT-38
  milestone: M2
  scenario: A 300-member Maharashtra society has 20 verified attendees
  expected: Quorum is met for an AGM but not for redevelopment, which needs 200
  prd_page: 47
- id: AT-39
  milestone: M1
  scenario: A 6,200 rupee NEFT credit lands in a unit's virtual account
  expected: A receipt is created and allocated to the oldest open invoice and the resident is notified within 60
    seconds
  prd_page: 47
