  milestone: M2
  scenario: OCR confuses 8,000 rupees with 80,000 rupees on a vendor bill
  expected: Uncertainty, the arithmetic check and a reviewer stop the posting
  prd_page: 46
- id: AT-29
  milestone: M1
  scenario: The AI provider is unavailable or the society's AI budget is exhausted
  expected: Forms, gate and billing keep working with no blocking spinner
  prd_page: 46
- id: AT-30
  milestone: M3
  scenario: A meter resets or its messages are duplicated
  expected: No negative or duplicated billed consumption and a review flag is raised
  prd_page: 46
- id: AT-31
  milestone: M3
  scenario: The EV site meter goes stale or a phase is overloaded
  expected: The local engineered cap or pause applies and no model can override it
  prd_page: 46
- id: AT-32
  milestone: M1
  scenario: A committee term ends while a privileged session is active
  expected: The privileged action is denied and the audit trail is preserved
  prd_page: 46
- id: AT-33
  milestone: M1
  scenario: The full financial export is re-imported into an external system
  expected: Trial balance, open items, funds and attachments reconcile
  prd_page: 46
- id: AT-34
  milestone: M1
  scenario: Restore after a regional-service incident
  expected: RPO and RTO are measured and ledger, permissions and tombstones are valid
  prd_page: 46
