  milestone: M1
  scenario: A low-vision user and a guard in a new language perform core tasks
  expected: Both finish accessibly and a supported alternative exists
  prd_page: 47
- id: AT-36
  milestone: M1
  scenario: A late settlement arrives after the migration cutover
  expected: It is routed to the correct source record with no duplicated balance
  prd_page: 47
