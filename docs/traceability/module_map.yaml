# Dwaar module map: logical target modules, build slices (PRD 4.3), AT gates, external dependencies.
# Logical module paths follow the PRD 19.1 layout. API modules are "services/api/modules/<name>" here and live at
# "services/api/dwaar_api/modules/<name>" on disk (physical_path); the register's `module` field uses the logical path.
# Per-requirement module and slice live in requirements.yaml; this file adds surfaces (secondary modules), the AT
# gates that exercise the requirement (inverted from the AT links) and external dependencies from the catalogue below.
# `gates` are curated from the PRD acceptance matrix scenarios; a slice's own gate list is under `slices`.
version: 1
source: Dwaar Master PRD v2.0
milestone_of_slice: {1: M0, 2: M0, 3: M1, 4: M1, 5: M1, 6: M1, 7: M2, 8: M2, 9: M3}
slices:
- id: 1
  milestone: M0
  deliverable: Repo, identity, scoped schema, synthetic data, CI, audit foundation
  gate_ats: [AT-01, AT-02]
  gate_note: Gate before slice 2 (PRD 4.3)
- id: 2
  milestone: M0
  deliverable: Visitor request, decision and observation across resident and guard apps
  gate_ats: [AT-03, AT-04]
  gate_note: 'Gate before slice 3: AT-03 and AT-04 with real persistence (PRD 4.3)'
- id: 3
  milestone: M1
  deliverable: Edge cache, signed policy, outbox, simulator
  gate_ats: [AT-05, AT-06, AT-07, AT-08]
  gate_note: Gate before slice 4 (PRD 4.3)
- id: 4
  milestone: M1
  deliverable: Notification cascade, parcels, staff, shift handover, helpdesk
  gate_ats: [AT-11, AT-12, AT-13, AT-40]
  gate_note: Gate before slice 5 also includes field usability (PRD 4.3)
- id: 5
  milestone: M1
  deliverable: Ledger, bills, receipts, cash, manual bank import
  gate_ats: [AT-14, AT-15, AT-16, AT-17, AT-18]
  gate_note: Gate before slice 6 also includes an auditor-approved fixture (PRD 4.3)
- id: 6
  milestone: M1
  deliverable: Privacy, retention, exports, backup and security hardening; M1 pilot
  gate_ats: [AT-23, AT-24, AT-33, AT-34]
  gate_note: Gate for the M1 pilot (PRD 4.3)
- id: 7
  milestone: M2
  deliverable: Full ERP, PPM, live payments, Tally/Zoho, governance, M2 AI
  gate_ats: []
  gate_note: Gate is provider, CA and security evaluation for the M2 release (PRD 4.3); no AT range listed
- id: 8
  milestone: M2
  deliverable: Barrier and RFID adapter
  gate_ats: [AT-09, AT-10]
  gate_note: Gate also includes installer sign-off (PRD 4.3)
- id: 9
  milestone: M3
  deliverable: ANPR, metering, DG, EV
  gate_ats: []
  gate_note: Gate is M3 field tests (PRD 4.3); no AT range listed
