external_dependencies:
- id: provider:payment-aggregator
  kind: provider
  description: 'RBI-authorised payment aggregator (default Razorpay): UPI, cards, netbanking, virtual accounts,
    direct settlement'
  default_state: disabled until credentials and onboarding exist; sandbox or labelled simulator (simulation=true)
    in local
  decisions: [D-20, Q9]
- id: provider:bbpou
  kind: provider
  description: BBPS operating unit for bill payment, only when commercially confirmed (M2)
  default_state: disabled; no simulator before M2
  decisions: [D-20]
- id: provider:telephony-ivr
  kind: provider
  description: Indian cloud telephony for IVR and masked proxy calls
  default_state: disabled until vendor chosen; labelled simulator; intercom or office fallback stays visible
  decisions: [D-21, Q12]
- id: provider:sms-dlt
  kind: provider
  description: DLT-registered SMS headers and templates (also OTP delivery)
  default_state: disabled until DLT registration exists; labelled simulator
  decisions: [D-21, Q12]
- id: provider:whatsapp
  kind: provider
  description: WhatsApp utility templates
  default_state: disabled until a vendor and templates are approved; labelled simulator
  decisions: [D-21, Q12]
- id: provider:push
  kind: provider
  description: FCM and APNs push credentials
  default_state: disabled until a Firebase and Apple project exist; labelled simulator
  decisions: []
- id: provider:video
  kind: provider
  description: Video provider for hybrid meetings (M2)
  default_state: disabled; M2 only
  decisions: [D-21, Q12]
- id: provider:oidc-identity
  kind: provider
  description: OIDC identity provider with phone OTP and MFA (default Supabase Auth)
  default_state: labelled simulator issuer when DWAAR_ENV=local; real provider via adapter
  decisions: [D-09]
- id: provider:ai-model
  kind: provider
  description: LLM, speech and OCR provider (default Anthropic Claude, self-hosted faster-whisper)
  default_state: deterministic labelled simulator provider; real provider disabled until terms are signed and evaluation
    passes
  decisions: [D-18, D-19, Q13]
- id: provider:zoho-books
  kind: provider
  description: Zoho Books API for accounting export (M2)
  default_state: disabled; Tally XML file export has no provider
  decisions: [D-22]
- id: provider:gst-irp
  kind: provider
  description: GST invoice registration portal, only where legally required (M3)
  default_state: disabled
  decisions: []
- id: provider:android-enterprise
  kind: provider
  description: Android Enterprise management for guard terminals
  default_state: disabled; fleet functions stubbed behind an interface
  decisions: []
- id: provider:pentest-vendor
  kind: provider
  description: Independent penetration test before paid general availability
  default_state: external engagement; tracked as evidence
  decisions: []
- id: hardware:edge-gateway
  kind: hardware
  description: Certified fanless gateway with TPM, watchdog and UPS (field fsync, thermal, latency verification)
  default_state: software runs on any Linux host; no performance or durability claim until measured on the certified
    unit
  decisions: [D-12, Q3]
- id: hardware:barrier-controller
  kind: hardware
  description: One certified barrier controller model and revision, installer-commissioned
  default_state: simulator implements the same adapter contract; live adapter disabled until installer sign-off
  decisions: [D-23, Q3]
- id: hardware:rfid-reader
  kind: hardware
  description: One UHF RFID reader model
  default_state: simulator only until hardware is certified
  decisions: [D-23]
- id: hardware:anpr-camera
  kind: hardware
  description: ANPR camera, illumination and compute (M3)
  default_state: disabled; labelled simulator for adapter tests
  decisions: []
- id: hardware:meter-gateway
  kind: hardware
  description: LoRaWAN, Modbus or M-Bus meters, calibrated, with approved gateways (M3)
  default_state: disabled; replay simulator; no verified-volume label without calibration
  decisions: []
- id: hardware:fuel-sensor-genset
  kind: hardware
  description: DG fuel sensors and genset controller (M3)
  default_state: disabled; replay simulator
  decisions: []
- id: hardware:ocpp-charger
  kind: hardware
  description: Certified OCPP chargers and site meters (M3)
  default_state: disabled; simulator; engineered caps stay local
  decisions: []
- id: hardware:handheld-scanner
  kind: hardware
  description: USB or Bluetooth HID 2D scanner for sunlight use
  default_state: keyboard-wedge input handled in software; field test on a real scanner pending
  decisions: []
- id: partner:delivery-partner
  kind: partner
  description: Delivery partner signed-token access (M3)
  default_state: disabled until a written partner contract and production API rights exist
  decisions: [Q10]
- id: approval:legal-pack
  kind: approval
  description: Counsel-approved legal pack per society and jurisdiction
  default_state: pack ships unapproved; binding governance and statutory automation stay disabled
  decisions: [D-24, Q5, Q6, Q7]
- id: approval:counsel
  kind: approval
  description: Advocate confirmation of notices, retention, lawful basis and restrictions
  default_state: configuration ships as unapproved defaults
  decisions: [D-16, D-25, Q4]
- id: approval:ca
  kind: approval
  description: Chartered accountant confirmation of fund, depreciation, GST and TDS treatment
  default_state: tax and fund rules ship as unapproved configuration
  decisions: [Q8]
- id: approval:acquirer
  kind: approval
  description: Written acquirer schedule for UPI MDR classification and channel costs
  default_state: cost configuration marked VERIFY and shown as unconfirmed
  decisions: [D-28, Q9]
- id: approval:installer
  kind: approval
  description: Qualified installer and society commissioning sign-off
  default_state: live actuation stays disabled
  decisions: [D-23]
- id: approval:metrology
  kind: approval
  description: Metrology review of tanker variance thresholds and calibration
  default_state: threshold fixed at the proposal and flagged unreviewed
  decisions: []
- id: approval:discom
  kind: approval
  description: DISCOM, operator and tax approval for EV charging billing
  default_state: EV billing disabled
  decisions: []
- id: approval:ai-provider-terms
  kind: approval
  description: 'Signed AI provider terms: region, retention, no-training'
  default_state: real AI provider disabled; simulator only
  decisions: [D-18, Q13]
- id: field:pilot-measurement
  kind: field
  description: Measurements taken on real devices, sites and traffic (INV-12)
  default_state: targets are tested with simulated load only; no SLO claim until measured in the field
  decisions: []
- id: data:baseline-observation
  kind: data
  description: 60 to 90 days of baseline observation for data-dependent AI (PRD 11.4)
  default_state: transparent rules first; insufficient data is a valid output
  decisions: []
worker_jobs:
- id: notification-calling
  module: services/worker
  trigger: Event-driven
  reliability: Expiry-aware; cancels on decision; deduplicates per request, channel and recipient
  requirements: [NOTIF-03, NOTIF-04, CALL-01]
- id: edge-policy-publisher
  module: services/worker
  trigger: On change and periodic refresh
  reliability: Signed monotonic version; atomic snapshot; revocations prioritised
  requirements: [EDGE-04, IAM-02, INV-08]
- id: billing-scheduler
  module: services/worker
  trigger: Approved calendar
  reliability: Preview and approval gate; unique billing key; no double run after restart
  requirements: [FIN-03, NFR-12]
- id: settlement-reconciliation
  module: services/worker
  trigger: Provider event and daily statement
  reliability: Exception queue; no silent gross/net mismatch
  requirements: [PAY-09, PAY-10]
- id: pm-generator
  module: services/worker
  trigger: Hourly and meter thresholds
  reliability: Unique asset-plan-cycle; safe retry
  requirements: [OPS-06]
- id: retention-index-purge
  module: services/worker
  trigger: Nightly and on rights or hold events
  reliability: Archive and hold checks; tombstones; per-replica outcome
  requirements: [PRIV-08, DB-08]
- id: ai-ingestion
  module: services/worker
  trigger: Document publication
  reliability: Malware-safe parsing; scoped index; re-index or delete on version change
  requirements: [AI-SYS-02, AI-SYS-03, AI-R01]
- id: hash-chain-verifier
  module: services/worker
  trigger: Nightly
  reliability: Alert on any journal chain break
  requirements: [DB-07, FIN-07]
- id: backup-restore-drill
  module: services/worker
  trigger: Continuous backup; scheduled drill
  reliability: Restore evidence; permission and tombstone checks; measured RPO and RTO
  requirements: [NFR-11, PRIV-09, D-17]
