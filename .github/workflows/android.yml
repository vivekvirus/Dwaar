name: android

on:
  push:
    branches: [main]
    paths:
      - "apps/guard-android/**"
      - "packages/i18n/**"
      - "packages/dwaar-common/**"
      - "tools/dev/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/guard-android/**"
      - "packages/i18n/**"
      - "packages/dwaar-common/**"
      - "tools/dev/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-android:
    name: guard-android (core tests, i18n gate, debug APK, lint, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The Android SDK is reproduced by the same script a developer uses on a clean machine.
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          tools/dev/android/bootstrap-sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # Golden vectors are generated by the Python reference; fail if the committed file drifted from it.
      - uses: astral-sh/setup-uv@v5
      - name: Golden vectors are current
        run: |
          uv sync --frozen --package dwaar-common
          uv run --no-sync python tools/dev/android/gen_golden_vectors.py
          git diff --exit-code -- apps/guard-android/core/src/test/resources/golden/edge_vectors.json

      - name: Core tests (JVM, includes the cross-language golden vectors)
        working-directory: apps/guard-android
        run: ./gradlew :core:test --console=plain

      - name: i18n gate fails on a missing guard key
        run: tools/dev/android/test-i18n-gate.sh

      - name: Debug APK
        working-directory: apps/guard-android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Lint
        working-directory: apps/guard-android
        run: ./gradlew :app:lintDebug --console=plain

      - name: App unit tests (Robolectric, JVM)
        working-directory: apps/guard-android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: guard-debug-apk
          path: apps/guard-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
